name: Build macOS App

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: # Permet de lancer la compilation manuellement depuis GitHub

jobs:
  build-mac:
    runs-on: macos-14
    strategy:
      matrix:
        include:
          - arch: x64
            arch_name: Intel-Anciens-Macs
          - arch: arm64
            arch_name: PuceApple-Nouveaux-Macs

    steps:
    - name: Checkout du code
      uses: actions/checkout@v4

    - name: Configuration de Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        architecture: ${{ matrix.arch }}

    - name: Installation des dépendances
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Compilation avec PyInstaller
      run: |
        pyinstaller main.spec

    - name: Compression de l'application (pour préserver les droits)
      run: |
        cd dist
        ditto -c -k --keepParent LogcielMedecin.app LogcielMedecin.zip

    - name: Upload de l'application (.zip)
      uses: actions/upload-artifact@v4
      with:
        name: LogcielMedecin-macOS-${{ matrix.arch_name }}
        path: dist/LogcielMedecin.zip
