name: Build macOS App

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: # Permet de lancer la compilation manuellement depuis GitHub

jobs:
  build-mac:
    runs-on: macos-latest

    steps:
    - name: Checkout du code
      uses: actions/checkout@v4

    - name: Configuration de Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11' # Ou la version que vous utilisez

    - name: Installation des dépendances
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Compilation avec PyInstaller
      run: |
        pyinstaller main.spec

    - name: Upload de l'application (.app)
      uses: actions/upload-artifact@v4
      with:
        name: LogcielMedecin-macOS
        path: dist/LogcielMedecin.app
